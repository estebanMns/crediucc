# Semanas 4, 5 y 10: manifiesto declarativo del entorno completo de QA/Staging.
#   docker compose --profile qa up --build --exit-code-from test-runner -> pipeline local de QA
#   docker compose up -d --build frontend                         -> entorno de staging
#   docker compose down -v                                     -> destrucción limpia
services:
  localstack:                       # Nube AWS emulada (S3 + SQS)
    image: localstack/localstack:3.8.1
    container_name: crediucc_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  infra-init:                       # IaC: crea bucket y cola (idempotente)
    build: ./infra
    image: crediucc-infra-init:1.0.0
    container_name: crediucc_infra_init
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  api:                              # Servicio bajo prueba
    build:
      context: .
      dockerfile: app/Dockerfile
    image: crediucc-api:1.0.0
    container_name: crediucc_api
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_HEALTHY=${APP_HEALTHY:-true}
      - CENTRAL_RIESGO_LATENCIA_MS=${CENTRAL_RIESGO_LATENCIA_MS:-150}
      - CLOUD_ENABLED=true
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test          # credenciales dummy: solo válidas en LocalStack
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      infra-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:                         # Interfaz Next.js
    build:
      context: ./frontend
      args:
        - API_URL=http://api:8000
    container_name: crediucc_frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  test-runner:                      # Contenedor efímero de pruebas de API
    build: ./tests/api
    container_name: crediucc_test_runner
    environment:
      - API_URL=http://api:8000
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test          # credenciales dummy: solo válidas en LocalStack
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      api:
        condition: service_healthy
    profiles: ["qa"]
