[project]
name = "crediucc"
version = "1.0.0"
description = "Proyecto integrador de Pruebas y Mantenimiento de Software"
requires-python = ">=3.11"

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", "frontend/*", ".venv/*", "venv/*", "load/locustfile.py", "load/estres.py"]

# Semana 7: el linter es la primera inspección estática del pipeline.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W estilo, F errores, I imports, B bugs probables, UP modernización,
# SIM simplificación, RUF reglas propias de ruff, N nombres (PEP 8)
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y signos del español en textos

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
