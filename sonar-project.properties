# Semana 7: configuración de SonarCloud.
sonar.organization=estebanmns
sonar.projectKey=estebanMns_crediucc
sonar.projectName=CrediUCC

sonar.python.version=3.11

# Código de producción vs. código de pruebas: las pruebas usan datos ficticios (contraseñas de ejemplo,
# URLs locales) que no deben contarse como riesgos de seguridad del producto.
sonar.sources=app,deploy,infra,load,db,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.tsx
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/coverage/**,frontend/next.config.ts,frontend/eslint.config.mjs,frontend/src/app/layout.tsx,frontend/src/**/*.test.tsx

# El job falla si el Quality Gate de SonarCloud no pasa.
sonar.qualitygate.wait=true
